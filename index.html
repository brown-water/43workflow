<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=dist/index.html">
  <title>Redirecting to Master Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #F5F0E8; /* Covenant Tan base */
      --bg-surface: #EAE4D8; /* Covenant Tan surface */
      --accent-primary: #1A2332; /* Covenant Navy */
      --accent-gold: #B8923A; /* Covenant Brass */
      --text-main: #1C1A16; /* Covenant high-contrast dark text */
      --text-muted: #70685C;
    }

    body {
      font-family: Verdana, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .redirect-card {
      background: var(--bg-surface);
      border: 2px solid var(--accent-gold);
      border-radius: 10px; /* Covenant strict radius cap */
      padding: 40px;
      text-align: center;
      max-width: 450px;
    }

    h1 {
      font-family: Verdana, sans-serif;
      font-size: 2rem;
      color: var(--accent-primary);
      margin-top: 0;
      margin-bottom: 15px;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .loader {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--text-muted);
      border-radius: 50%;
      border-top-color: var(--accent-gold);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: var(--accent-primary);
      color: #F5F0E8;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px; /* Covenant strict cap */
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid var(--accent-primary);
    }

    .btn:hover {
      background: var(--bg-base);
      color: var(--accent-primary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="loader"></div>
    <h1>Master Planner</h1>
    <p>Redirecting you to the Reconciliation Engine workspace. If you are not redirected automatically in a moment, please click the button below.</p>
    <a href="dist/index.html" class="btn">Launch Master Planner</a>
  </div>
</body>
</html>
